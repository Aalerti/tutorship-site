<header class="site-header" data-site-header>
  <div class="site-header-inner">
    <a class="site-header-brand" href="{{ .Site.BaseURL | relLangURL }}" aria-label="На главную">
      <span class="site-header-brand-mark">&&</span>
      <span class="site-header-brand-text">{{ .Site.Title }}</span>
    </a>

    <nav class="site-header-menu" id="site-header-menu" aria-label="Главная навигация" data-site-menu>
      <a class="site-header-link" href="/" data-spa-link>Главная</a>
      <a class="site-header-link" href="/inside" data-spa-link>Что внутри</a>
      <a class="site-header-link" href="https://www.sgu.ru/" target="_blank" rel="noopener noreferrer">СГУ</a>
      <button class="site-header-link site-header-button" type="button" data-history-back>Назад</button>
      <button class="site-header-link site-header-button site-header-admin" type="button" aria-controls="admin-panel-body" aria-expanded="false" data-admin-nav-toggle hidden>Тьюторский режим</button>
    </nav>

    <div class="site-header-actions">
      <button id="theme-toggle" class="theme-toggle-btn" type="button" aria-label="Переключить тему" title="Переключить тему">
        <svg class="theme-icon theme-icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="theme-icon theme-icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>

      <button class="site-header-burger" type="button" aria-label="Открыть меню" aria-controls="site-header-menu" aria-expanded="false" data-site-menu-toggle>
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>
</header>
