<section class="group-picker" id="groups" aria-label="Выбор направления">
  <div class="section-heading">
    <p class="section-kicker">Направления КНиИТ</p>
    <h2 class="group-picker-title">Выберите свою группу</h2>
  </div>

  <div class="group-cards">
    {{ range .Site.Data.groups }}
      {{ $full := default .name .full }}
      <div class="group-card{{ if not .ready }} soon{{ end }}" data-direction-card="{{ .code }}" title="{{ $full }}">
        <a class="group-link" href="#{{ .code }}" aria-label="{{ $full }} — перейти к доске"></a>
        <span class="group-short">{{ .short }}</span>
        <span class="group-name">{{ .name }}</span>
        {{ if .ready }}
          <span class="group-action">Открыть гайды</span>
        {{ else }}
          <span class="group-stamp">Скоро</span>
        {{ end }}
      </div>
    {{ end }}
  </div>
</section>
