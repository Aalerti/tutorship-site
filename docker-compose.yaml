services:
  web:
    build:
      context: ./
      args:
        HUGO_BASEURL: ${HUGO_BASEURL:-http://localhost:1313}
        TUTORSHIP_API_BASE: ${TUTORSHIP_API_BASE:-}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-1313}:80"
    platform: linux/amd64
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tutorship}
      POSTGRES_USER: ${POSTGRES_USER:-tutorship}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tutorship}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-tutorship}:${POSTGRES_PASSWORD:-tutorship}@postgres:5432/${POSTGRES_DB:-tutorship}
      PORT: 4000
      HOST: 0.0.0.0
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-change-this-access-secret-32chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-only-change-this-refresh-secret-32chars}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-2592000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@tutorship.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:1313}
      UPLOAD_DIR: /app/uploads
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      - backend-uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres-data:
  backend-uploads:
