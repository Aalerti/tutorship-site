services:
  web:
    build: ./
    ports:
      - "1313:1313"
    platform: linux/amd64

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tutorship
      POSTGRES_USER: tutorship
      POSTGRES_PASSWORD: tutorship
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://tutorship:tutorship@postgres:5432/tutorship
      PORT: 4000
      HOST: 0.0.0.0
      JWT_ACCESS_SECRET: change-this-access-secret
      JWT_REFRESH_SECRET: change-this-refresh-secret
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL_SECONDS: 2592000
      COOKIE_SECURE: "false"
      PUBLIC_SITE_URL: http://localhost:1313
      UPLOAD_DIR: /app/uploads
    ports:
      - "4000:4000"
    volumes:
      - backend-uploads:/app/uploads

volumes:
  postgres-data:
  backend-uploads:
