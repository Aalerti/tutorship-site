# Направления факультета КНиИТ.
#
# code        — якорь раздела на главной (#pi, #fiit, ...)
# ready       — есть ли уже материалы; false рисует штамп «Скоро»
# contentDir  — папка с гайдами направления, например "posts/2025/"
# tutors      — авторы материалов; photo — css-класс с фото в custom.scss
#
# Чтобы открыть направление: добавьте contentDir + tutors и поставьте ready: true.
# Чтобы добавить новое направление: допишите блок в этот список.

- code: "pi"
  short: "ПИ"
  name: "Программная инженерия"
  full: "Программная инженерия"
  ready: true
  contentDir: "posts/2025/"
  tutors:
    - first: "Максим"
      last: "Бретт"
      photo: "maxim"
    - first: "Илья"
      last: "Зуев"
      photo: "ilya"

- code: "fiit"
  short: "ФИИТ"
  name: "Фундаментальная информатика и ИТ"
  full: "Фундаментальная информатика и информационные технологии"
  ready: false

- code: "moais"
  short: "МОАИС"
  name: "Матобеспечение и администрирование ИС"
  full: "Математическое обеспечение и администрирование информационных систем"
  ready: false

- code: "kb"
  short: "КБ"
  name: "Компьютерная безопасность"
  full: "Компьютерная безопасность"
  ready: false

- code: "sau"
  short: "САУ"
  name: "Системный анализ и управление"
  full: "Системный анализ и управление"
  ready: false

- code: "ivt"
  short: "ИВТ"
  name: "Информатика и вычислительная техника"
  full: "Информатика и вычислительная техника"
  ready: false
